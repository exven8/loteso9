name: Build VayVPN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Transform SlipNet into VayVPN
        run: |
          echo "Starting stripping process..."
          
          # 1. Change App Name to VayVPN
          find app/src/main/res/values -name "strings.xml" -exec sed -i 's/SlipNet/VayVPN/g' {} +
          
          # 2. Hide Unwanted UI Elements (Settings, Logs, Protocol selector)
          sed -i '/android:id="@+id\/settings"/a \        android:visibility="gone"' app/src/main/res/layout/activity_main.xml
          sed -i '/android:id="@+id\/logs"/a \        android:visibility="gone"' app/src/main/res/layout/activity_main.xml
          sed -i '/android:id="@+id\/protocol"/a \        android:visibility="gone"' app/src/main/res/layout/activity_main.xml
          sed -i '/android:id="@+id\/server"/a \        android:visibility="gone"' app/src/main/res/layout/activity_main.xml
          
          echo "Transformation complete!"
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build VayVPN (Lite Variant)
        run: ./gradlew assembleLiteDebug --no-daemon

      - name: Upload VayVPN APK
        uses: actions/upload-artifact@v4
        with:
          name: VayVPN-App
          path: app/build/outputs/apk/lite/debug/*.apk
