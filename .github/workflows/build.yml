name: Build VayVPN (Stripped)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Transform SlipNet into VayVPN
        run: |
          echo "Starting stripping process..."
          # 1. Change App Name to VayVPN
          sed -i 's/SlipNet/VayVPN/g' app/src/main/res/values/strings.xml
          
          # 2. Delete Bloatware (Tor, NaiveProxy, Obfs4) to shrink APK size
          rm -f app/src/full/jniLibs/*/libtor.so
          rm -f app/src/full/jniLibs/*/libnaive.so
          rm -f app/src/full/jniLibs/*/libobfs4proxy.so
          
          # 3. Hide Unwanted UI Elements (Settings, Logs, Protocol selector)
          # We use sed to add android:visibility="gone" to the specific buttons
          sed -i '/android:id="@+id\/settings"/a \        android:visibility="gone"' app/src/main/res/layout/activity_main.xml
          sed -i '/android:id="@+id\/logs"/a \        android:visibility="gone"' app/src/main/res/layout/activity_main.xml
          sed -i '/android:id="@+id\/protocol"/a \        android:visibility="gone"' app/src/main/res/layout/activity_main.xml
          sed -i '/android:id="@+id\/server"/a \        android:visibility="gone"' app/src/main/res/layout/activity_main.xml
          echo "Transformation complete!"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build VayVPN Release APK
        run: ./gradlew assembleFullRelease

      - name: Upload VayVPN APK
        uses: actions/upload-artifact@v4
        with:
          name: VayVPN-Release
          path: app/build/outputs/apk/full/release/*.apk
